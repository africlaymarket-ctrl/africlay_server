<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title></head>
<body style="margin:0;background:#f7f4ef;color:#17251c;font-family:Arial,sans-serif">
  <div style="max-width:600px;margin:0 auto;padding:28px 20px">
    <div style="color:#147a2b;font-size:22px;font-weight:bold">AfriClay Market</div>
    <div style="background:#fff;border-radius:14px;padding:28px;margin-top:18px">
      <h1 style="font-size:24px;line-height:1.3;margin:0 0 16px">{{ title }}</h1>
      <p style="font-size:16px;line-height:1.6;white-space:pre-line">{{ message }}</p>
      {% if action_url %}<p style="margin:28px 0"><a href="{{ action_url }}" style="background:#147a2b;color:#fff;text-decoration:none;border-radius:8px;padding:13px 20px;display:inline-block">View in AfriClay</a></p>{% endif %}
    </div>
    <p style="font-size:13px;line-height:1.5;color:#59635c">This update relates to your AfriClay account. You can change optional email updates in Profile settings. Need help? <a href="mailto:{{ support_email }}">{{ support_email }}</a>.</p>
  </div>
</body>
</html>
