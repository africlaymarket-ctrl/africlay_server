[project]
name = "africlay-server"
version = "0.1.0"
description = "Backend server for Africlay app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.8.1",
    "django-cors-headers>=4.7.0",
    "django-storages[google]>=1.14.6",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pyjwt==2.10.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "gunicorn>=23.0.0",
]
