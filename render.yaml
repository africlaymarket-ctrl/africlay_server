services:
  - type: web
    name: africlay-server
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install uv
      uv sync --no-install-project
    startCommand: python manage.py migrate --noinput && gunicorn africlay_server.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/schema/
    envVars:
      - key: PYTHON_VERSION
        value: "3.14"
      - key: DEV_ENVIRONMENT
        value: prod
      - key: SECRET_KEY
        generateValue: true
      - key: PROD_ALLOWED_HOSTS
        value: africlay-server.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_S3_ENDPOINT_URL
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_SIGNED_URL_TTL
        value: "3600"
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_HOST_USER
        value: ""
      - key: EMAIL_HOST_PASSWORD
        value: ""
      - key: DEFAULT_FROM_EMAIL
        value: "no-reply@africlay.com"
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        value: ""
      - key: MPESA_CONSUMER_SECRET
        value: ""
      - key: MPESA_SHORTCODE
        value: ""
      - key: MPESA_PASSKEY
        value: ""
      - key: MPESA_CALLBACK_BASE_URL
        value: https://africlay-server.onrender.com
      - key: MPESA_PUBLIC_CERT
        value: ""
